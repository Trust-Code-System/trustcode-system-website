<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Network segmentation lab topology">
  <rect width="1280" height="800" fill="#0b1220"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <text x="64" y="64" font-family="ui-monospace,monospace" font-size="16" fill="#6f8eff" letter-spacing="3">CISCO · SEGMENTATION</text>
  <text x="64" y="108" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#f8fafc">Network Security Lab</text>
  <rect x="540" y="170" width="200" height="64" rx="10" fill="#1b3fae"/>
  <text x="640" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#fff">Core Switch</text>
  <path d="M640 234 V280" stroke="#6f8eff" stroke-width="2"/>
  <path d="M220 280 H1060" stroke="#6f8eff" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#f8fafc">
    <rect x="140" y="300" width="180" height="70" rx="8" fill="#152238" stroke="#25c08a"/><text x="230" y="342" text-anchor="middle">VLAN 10</text>
    <rect x="380" y="300" width="180" height="70" rx="8" fill="#152238" stroke="#6f8eff"/><text x="470" y="342" text-anchor="middle">VLAN 20</text>
    <rect x="620" y="300" width="180" height="70" rx="8" fill="#152238" stroke="#6f8eff"/><text x="710" y="342" text-anchor="middle">VLAN 30</text>
    <rect x="860" y="300" width="200" height="70" rx="8" fill="#152238" stroke="#6f8eff"/><text x="960" y="342" text-anchor="middle">WLAN / Trunk</text>
  </g>
  <rect x="140" y="430" width="920" height="100" rx="12" fill="#152238" stroke="#1e2a44"/>
  <text x="180" y="480" font-family="ui-monospace,monospace" font-size="16" fill="#25c08a">Static routing · EtherChannel · OSPF · Packet Tracer</text>
  <text x="180" y="512" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">Lab addressing only — no production networks</text>
  <text x="64" y="740" font-family="ui-monospace,monospace" font-size="14" fill="#64748b">TrustCode · Network lab showcase</text>
</svg>
