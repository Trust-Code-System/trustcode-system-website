<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="Home detection lab network topology">
  <rect width="1280" height="800" fill="#0b1220"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <text x="64" y="64" font-family="ui-monospace,monospace" font-size="16" fill="#6f8eff" letter-spacing="3">SOC · DETECTION LAB</text>
  <text x="64" y="108" font-family="Georgia,serif" font-size="36" font-weight="700" fill="#f8fafc">Home Detection Lab</text>
  <rect x="520" y="180" width="200" height="70" rx="10" fill="#1b3fae"/>
  <text x="620" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#fff">PfSense</text>
  <path d="M620 250 V300" stroke="#6f8eff" stroke-width="2"/>
  <path d="M200 300 H1040" stroke="#6f8eff" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#f8fafc">
    <rect x="120" y="320" width="160" height="64" rx="8" fill="#152238" stroke="#25c08a"/><text x="200" y="358" text-anchor="middle">Splunk</text>
    <rect x="320" y="320" width="160" height="64" rx="8" fill="#152238" stroke="#6f8eff"/><text x="400" y="358" text-anchor="middle">Kali</text>
    <rect x="520" y="320" width="160" height="64" rx="8" fill="#152238" stroke="#6f8eff"/><text x="600" y="358" text-anchor="middle">Ubuntu</text>
    <rect x="720" y="320" width="180" height="64" rx="8" fill="#152238" stroke="#6f8eff"/><text x="810" y="358" text-anchor="middle">Win Server</text>
    <rect x="940" y="320" width="160" height="64" rx="8" fill="#152238" stroke="#6f8eff"/><text x="1020" y="358" text-anchor="middle">Win 10</text>
  </g>
  <rect x="120" y="460" width="980" height="120" rx="12" fill="#152238" stroke="#1e2a44"/>
  <text x="160" y="515" font-family="ui-monospace,monospace" font-size="16" fill="#25c08a">MITRE ATT&amp;CK · traffic control · log monitoring · incident notes</text>
  <text x="160" y="550" font-family="system-ui,sans-serif" font-size="16" fill="#94a3b8">Sanitised topology, no real IPs, credentials, or private hostnames</text>
  <text x="64" y="740" font-family="ui-monospace,monospace" font-size="14" fill="#64748b">TrustCode · Security lab showcase</text>
