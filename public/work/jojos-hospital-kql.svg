<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="KQL threat investigation composition">
  <rect width="1280" height="800" fill="#0b1220"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <text x="64" y="64" font-family="ui-monospace,monospace" font-size="16" fill="#6f8eff" letter-spacing="3">SENTINEL · KQL</text>
  <text x="64" y="108" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#f8fafc">Jojo&#39;s Hospital Investigation</text>
  <rect x="64" y="160" width="720" height="280" rx="12" fill="#111827" stroke="#1e2a44"/>
  <text x="96" y="210" font-family="ui-monospace,monospace" font-size="18" fill="#25c08a">DeviceEvents</text>
  <text x="96" y="250" font-family="ui-monospace,monospace" font-size="16" fill="#94a3b8">| where ActionType has &quot;PowerShell&quot;</text>
  <text x="96" y="290" font-family="ui-monospace,monospace" font-size="16" fill="#94a3b8">| join kind=inner (IdentityInfo) on Account</text>
  <text x="96" y="330" font-family="ui-monospace,monospace" font-size="16" fill="#94a3b8">| summarize count() by bin(TimeGenerated, 1h)</text>
  <text x="96" y="370" font-family="ui-monospace,monospace" font-size="16" fill="#6f8eff">| extend Phase = &quot;Execution&quot;</text>
  <rect x="820" y="160" width="360" height="280" rx="12" fill="#152238" stroke="#1b3fae"/>
  <text x="1000" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Timeline</text>
  <text x="1000" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#25c08a">1 · Phishing</text>
  <text x="1000" y="310" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#94a3b8">2 · Payload</text>
  <text x="1000" y="350" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#94a3b8">3 · PrivEsc</text>
  <text x="1000" y="390" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#94a3b8">4 · Callback</text>
  <rect x="64" y="480" width="1116" height="100" rx="12" fill="#152238" stroke="#1e2a44"/>
  <text x="96" y="540" font-family="system-ui,sans-serif" font-size="18" fill="#f8fafc">Findings · MITRE mapping · mitigation notes (sanitised)</text>
  <text x="64" y="740" font-family="ui-monospace,monospace" font-size="14" fill="#64748b">TrustCode · Threat investigation showcase</text>
</svg>
